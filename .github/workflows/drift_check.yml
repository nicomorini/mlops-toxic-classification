name: Nightly Data Drift Detection

on:
  # Run automatically every day at midnight UTC
  schedule:
    - cron: '0 0 * * *'
  # Allow manual trigger from the GitHub UI for testing
  workflow_dispatch:

jobs:
  check-drift:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Drift Detection Script
        run: |
          # The script will exit with code 1 if drift is detected.
          # This will cause this step to fail, turning the GitHub Actions run RED
          # and sending an automated email alert to the repository owner.
          python src/monitor_drift.py