name: Continuous Integration and Deployment

# Trigger the workflow on push or pull request events on the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx ruff pytest

      - name: Run Ruff Linter and Formatter check
        run: |
          ruff check .
          ruff format --check .

      - name: Train baseline model
        run: python src/train.py

      - name: Run Pytest
        run: pytest tests/

  build-and-deploy:
    # Wait for tests to pass before deploying
    needs: test-and-lint
    # Only deploy when pushing to main (do not deploy pull requests from other branches)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Note: Since our DVC remote is currently just a local folder on your PC, 
      # GitHub cannot pull the real model. We generate a fresh baseline model here 
      # so the Docker image has a model.joblib to copy into the container.
      - name: Set up Python to train dummy model
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requirements for training
        run: pip install -r requirements.txt
      - name: Train baseline model
        run: python src/train.py

      # --- Google Cloud Authentication & Setup ---
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker europe-west1-docker.pkg.dev

      # --- Docker Build & Push ---
      - name: Build and Push Docker Image
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: europe-west1
          REPO: mlops-repo
          IMAGE: mlops-toxic-api
          TAG: ${{ github.sha }}
        run: |
          # Construct the full image URL required by Artifact Registry
          IMAGE_URL="$REGION-docker.pkg.dev/$PROJECT_ID/$REPO/$IMAGE:$TAG"
          
          # Build the Docker image
          docker build -t $IMAGE_URL .
          
          # Push the image to GCP
          docker push $IMAGE_URL

      # --- Cloud Run Deploy ---
      - name: Deploy to Cloud Run
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: europe-west1
          REPO: mlops-repo
          IMAGE: mlops-toxic-api
          TAG: ${{ github.sha }}
        run: |
          IMAGE_URL="$REGION-docker.pkg.dev/$PROJECT_ID/$REPO/$IMAGE:$TAG"
          
          gcloud run deploy $IMAGE \
            --image $IMAGE_URL \
            --region $REGION \
            --project $PROJECT_ID \
            --allow-unauthenticated